name: Recolectar precios

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días a las 6:00 a. m. de El Salvador (12:00 UTC)
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: recolectar-precios
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar precios del día
        run: python -m canastasv recolectar

      - name: Mostrar comparativa
        if: always()
        run: python -m canastasv comparar || true

      - name: Guardar la base de datos en el repositorio
        if: always()
        run: |
          git config user.name "canastasv-bot"
          git config user.email "canastasv-bot@users.noreply.github.com"
          git add data/canastasv.db
          if git diff --cached --quiet; then
            echo "No hubo cambios en los datos."
          else
            git commit -m "Precios del $(date -u +%Y-%m-%d)"
            git push
          fi
